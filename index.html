<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171510">
  <title>UNTOLD Wiki</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <button id="menuButton" class="menu-button" type="button" aria-label="メニューを開く">☰</button>
    <a class="brand" href="#home"><span>UNTOLD</span><small>WORLD BIBLE</small></a>
    <label class="search"><span>検索</span><input id="searchInput" type="search" placeholder="ページを検索"></label>
  </header>
  <div class="layout">
    <aside id="sidebar" class="sidebar" aria-label="Wikiナビゲーション">
      <div id="status" class="status">読み込み中…</div>
      <nav id="navigation"></nav>
    </aside>
    <main id="content" class="content" tabindex="-1"></main>
  </div>
  <button id="backdrop" class="backdrop" type="button" aria-label="メニューを閉じる"></button>
  <script src="/app.js"></script>
</body>
</html>
