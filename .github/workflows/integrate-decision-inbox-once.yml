name: Integrate Decision Inbox Once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Decision Inbox
        run: python .github/scripts/integrate_decision_inbox.py
      - name: Commit changes
        run: |
          git config user.name "UNTOLD Wiki Bot"
          git config user.email "actions@users.noreply.github.com"
          git add pages/systems/cards.md pages/world/eld.md pages/world/eld-npcs.md decision-inbox.md
          git diff --cached --check
          git commit -m "docs: integrate decision inbox [skip ci]"
          git push origin HEAD:main
