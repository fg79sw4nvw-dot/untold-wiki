name: Validate AI routing

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'ai-index.json'
      - 'ai-current.json'
      - 'ai-manifest.json'
      - 'pages.json'
      - 'pages/**'
      - 'governance/**'
      - 'vercel.json'
      - 'tools/validate-ai-routing.mjs'
      - '.github/workflows/validate-ai-routing.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'ai-index.json'
      - 'ai-current.json'
      - 'ai-manifest.json'
      - 'pages.json'
      - 'pages/**'
      - 'governance/**'
      - 'vercel.json'
      - 'tools/validate-ai-routing.mjs'
      - '.github/workflows/validate-ai-routing.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/validate-ai-routing.mjs
