name: Migrate UNTOLD wiki from old branch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-from-old.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Copy canonical UNTOLD data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/untold-source
          git clone --depth 1 --branch untold-wiki https://github.com/fg79sw4nvw-dot/takken-kakomon-analysis.git /tmp/untold-source

          # Remove accidental bootstrap files from the new repository while
          # keeping this migration workflow and .git intact.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +

          cp /tmp/untold-source/wiki.json ./wiki.json
          cp -R /tmp/untold-source/assets ./assets
          mkdir -p pages
          if [ -d /tmp/untold-source/pages ]; then cp -R /tmp/untold-source/pages/. ./pages/; fi

          python - <<'PY'
          import json, pathlib

          repo = 'fg79sw4nvw-dot/untold-wiki'
          root = pathlib.Path('.')
          wiki_path = root / 'wiki.json'
          data = json.loads(wiki_path.read_text(encoding='utf-8'))

          data['repository'] = repo
          data['branch'] = 'main'
          data['sourceOfTruth'] = True
          data['updatedAt'] = '2026-09-12'

          old = '設定の正本はこの `untold-wiki` ブランチ内のWiki本文。'
          new = '設定の正本は GitHub リポジトリ `fg79sw4nvw-dot/untold-wiki` の `main` ブランチ内のWiki本文。'

          for page in data.get('pages', []):
              content = page.get('content', '')
              content = content.replace(old, new)
              page['content'] = content

              # Materialize every article as its own Markdown file so another
              # ChatGPT session can navigate the repository without parsing one
              # giant JSON document.
              path = page.get('path')
              if path:
                  p = root / path
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(content.rstrip() + '\n', encoding='utf-8')

          instructions = data.setdefault('instructions', [])
          rule = 'UNTOLDの正本は GitHub リポジトリ fg79sw4nvw-dot/untold-wiki の main ブランチ。各ページのMarkdownとwiki.jsonを同期して更新する。'
          if rule not in instructions:
              instructions.insert(0, rule)

          wiki_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = '''# UNTOLD Wiki\n\nUNTOLDのゲーム設計・実装仕様の正本リポジトリです。\n\n- 正本: `fg79sw4nvw-dot/untold-wiki` / `main`\n- Wiki一覧・メタデータ: `wiki.json`\n- 各記事: `pages/` 以下のMarkdown\n- 画像・視覚基準: `assets/`\n- 未確定事項: `pages/open-items.md`\n- ChatGPT実装引き継ぎ: `pages/development/implementation.md`\n\n新しいチャットでは「GitHubの `fg79sw4nvw-dot/untold-wiki` を正本として読み込む」と指定してください。\n\n## 更新ルール\n\n各ページのMarkdownと `wiki.json` 内の同ページ内容は同期して更新します。確定・一旦・案・未定を混同せず、未確定事項を勝手に確定しません。\n'''
          (root / 'README.md').write_text(readme, encoding='utf-8')
          PY

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate UNTOLD wiki to dedicated repository" || exit 0
          git push origin main
